aid: brightplan
name: BrightPlan
description: 'BrightPlan is a San Jose, California based financial wellness company
  that sells a Total Financial Wellness platform to enterprise HR and benefits teams,
  combining a self-service digital financial planning application, an AI-powered financial
  wellness coach, and access to human CFP fiduciary advisors. BrightPlan LLC is an
  SEC-registered investment adviser, and the product is delivered to employees as an
  employer-sponsored benefit rather than as a self-serve consumer subscription. The
  employee experience runs at my.brightplan.com and web.brightplan.com with iOS and
  Android apps; employer value is framed around benefits engagement, retention, and
  measurable financial wellbeing. BrightPlan markets HRIS and benefits-system integration
  to employers but publishes no public developer program, API reference, or machine-readable
  specification of any kind.'
